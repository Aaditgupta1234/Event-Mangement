services:
  - type: web
    name: festifyxr-api
    env: node
    rootDir: server
    plan: starter
    buildCommand: npm ci
    preDeployCommand: npm run migrate:host-request-indexes
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true

# Set the following environment variables in Render for this service:
# - MONGO_URI
# - JWT_SECRET
# - JWT_REFRESH_SECRET
# - CORS_ORIGIN
# - LOG_LEVEL
